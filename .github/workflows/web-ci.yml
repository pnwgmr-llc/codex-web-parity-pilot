name: Web CI

on:
  # Pull requests only. Every change reaches main through a pull request
  # whose required checks already ran this suite on the same tree, so a push
  # run would only repeat it (CI-COST rule 1).
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke-artifacts
          path: |
            artifacts/web-smoke
            playwright-report
          if-no-files-found: ignore
